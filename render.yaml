services:
  - type: web
    name: crypto-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.backend.server:app --host 0.0.0.0 --port 
    envVars:
      - key: OPENAI_API_KEY
        sync: false         # set in Render dashboard
      - key: WHISPER_MODEL
        value: whisper-1
      - key: MARKET_TOP_TTL
        value: "240"